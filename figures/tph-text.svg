<svg
  width="270"
  height="24"
  viewBox="0 0 270 24"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="tphGradient"
      x1="0"
      y1="0"
      x2="270"
      y2="24"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="30%" stop-color="#C94BFF"/>
      <stop offset="58%" stop-color="#F08A7C"/>
      <stop offset="100%" stop-color="#2D74DA"/>
    </linearGradient>
  </defs>

  <text
    x="2"
    y="12"
    dominant-baseline="middle"
    textLength="264"
    lengthAdjust="spacingAndGlyphs"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="20"
    font-weight="700"
    fill="url(#tphGradient)"
  >The Programmer's Hangout</text>
</svg>
